services:
  # Backend API Service
  - type: web
    name: catchers-ai-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ML_SERVICE_URL
        value: https://xscan-hx2f.onrender.com
      # Add your environment variables in Render dashboard:
      # - MONGODB_URI
      # - VIRUSTOTAL_API_KEY
      # - GOOGLE_SAFEBROWSING_API_KEY
      # - CORS_ORIGIN=https://catchers-ai.vercel.app

  # ML Service (Python)
  - type: web
    name: catchers-ai-ml
    env: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt && python -m app.train_model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.11
